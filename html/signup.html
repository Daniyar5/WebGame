<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGame — Регистрация</title>
    <link rel="stylesheet" href="../mane.css">
    <link rel="stylesheet" href="../css/signup.css">
</head>
<body>
    <main class="register-card">
        <h1>Регистрация</h1>
        <form id="register-form" novalidate>
            <div class="field">
                <label for="fullname">ФИО</label>
                <input id="fullname" name="fullname" type="text" autocomplete="name"
                       placeholder="Иванов Иван Иванович" required>
                <div class="hint">Введите фамилию, имя и отчество (отчество можно не указывать).</div>
                <div class="error" id="fullname-error"></div>
            </div>

            <div class="field">
                <label for="phone">Номер телефона</label>
                <input id="phone" name="phone" type="tel" autocomplete="tel"
                       placeholder="+996 555 123 456" required>
                <div class="hint">Формат Кыргызстана: +996 555 123 456 или 0555 123 456.</div>
                <div class="error" id="phone-error"></div>
            </div>

            <div class="field">
                <label for="email">Почта</label>
                <input id="email" name="email" type="email" autocomplete="email"
                       placeholder="example@mail.com" required>
                <div class="error" id="email-error"></div>
            </div>

            <button id="register-button" type="submit">Зарегистрироваться</button>
            <p id="form-message" role="status"></p>
        </form>
        <a class="back-link" href="../index.html">Вернуться на главную</a>
    </main>

    <script src="../js/signup.js"></script>
</body>
</html>
